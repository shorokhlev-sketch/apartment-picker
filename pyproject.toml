[project]
name = "apartment-picker-tools"
version = "0.1.0"
description = "Data tools for the apartment picker: PDF unit parser and placeholder renders"
requires-python = ">=3.10"
dependencies = ["pypdf>=4"]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pillow>=10", "numpy>=1.26"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
