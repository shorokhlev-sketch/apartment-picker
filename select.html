<!DOCTYPE html>
<html lang="ru" data-theme="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower 26 — подбор апартаментов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=202609222256">
<link rel="stylesheet" href="css/app.css?v=202609222256">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2322303F'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='16' fill='%23fff'%3E26%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="rail__head">
      <a class="app-logo" href="index.html" aria-label="Tower 26"><svg viewBox="0 0 200 44" fill="none" aria-hidden="true"><rect x=".5" y="2.5" width="40" height="40" rx="4" fill="currentColor"/><text x="20.5" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FFFFFF">26</text><text x="52" y="25" font-family="Georgia, serif" font-size="23" letter-spacing="2.5" fill="currentColor">TOWER</text><text x="52" y="38" font-family="'DM Sans', Arial, sans-serif" font-size="9" letter-spacing="2.5" fill="currentColor" opacity=".55">RESIDENCE</text></svg></a>
      <div class="icon-btns">
        <button class="ibtn" id="btnLang" type="button">ru</button>
        <a class="ibtn" id="btnPhone" href="tel:+995000000000" aria-label="Телефон"></a>
        <button class="ibtn" id="btnFav" type="button" aria-label="Избранное"></button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="railBody">
      <div class="counter" id="counter"></div>
      <div class="results" id="results"></div>
      <button class="load-more" id="loadMore" type="button"></button>
    </div>
    <div id="railPreview" hidden><img class="preview" id="preview" alt=""></div>
    <div id="railFav" hidden></div>
  </aside>
  <button class="rail-handle" id="railHandle" type="button" aria-label="Свернуть панель"></button>

  <section class="scene" id="scene">
    <header class="mhead">
      <a class="app-logo" href="index.html" aria-label="Tower 26"><svg viewBox="0 0 140 25" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="24" height="24" rx="2" fill="currentColor"/><text x="12.5" y="17.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#FFFFFF">26</text><text x="32" y="17" font-family="Georgia, serif" font-size="15" letter-spacing="2.5" fill="currentColor">TOWER</text></svg></a>
      <div class="icon-btns"><a class="ibtn" id="mBtnPhone" href="tel:+995000000000" aria-label="Телефон"></a><button class="ibtn" id="mBtnLang" type="button">ru</button></div>
    </header>

    <div class="scene__view scene3d is-on" id="scene3d">
      <canvas id="frameCanvas"></canvas>
      <svg class="polys" id="polys"></svg>
      <div class="cursor-dot" id="cursorDot"></div>
      <div class="frame-label" id="frameLabel"></div>
      <div class="capsule" id="capsule"><button class="rot" id="rotL" type="button" aria-label="Повернуть влево"></button><button class="rot" id="rotR" type="button" aria-label="Повернуть вправо"></button></div>
      <button class="toggle" id="toggle" type="button" aria-label="Показать все помещения"><span class="switch" id="switch"></span><span id="statusGrid"></span></button>
      <div class="upop" id="upop"></div>
    </div>

    <div class="scene__view sceneFloors" id="sceneFloors">
      <div class="compass" id="compass"></div>
      <div class="mfloor" id="mfloor"></div>
      <div class="plan-box" id="planBox"></div>
      <div class="stepper" id="stepper"></div>
      <div class="rose" id="rose"></div>
      <button class="toggle" id="toggleF" type="button" aria-label="Показать все помещения"><span class="switch" id="switchF"></span><span id="statusGridF"></span></button>
      <div class="upop" id="upopF"></div>
    </div>

    <div class="scene__view sceneChess" id="sceneChess">
      <div class="chess__toolbar" id="chessToolbar"></div>
      <div class="legend" id="legend"></div>
      <div class="chess__scroll" id="chessScroll"><div class="chess" id="chess"></div></div>
      <div class="chess__zoombar"><div class="zoom" id="zoom"></div></div>
    </div>

    <div class="segmented" id="segmented"></div>
  </section>
</div>

<div class="unit-page" id="unitPage" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Режимы"></nav>
<div class="sheet" id="sheet" aria-modal="true"></div>
<div class="modal" id="modal"></div>
<div class="cookie" id="cookieBanner" hidden></div>

<script src="js/config.js"></script>
<script src="js/state.js?v=202609222256"></script>
<script src="data/units.js?v=202609222256"></script>
<script src="data/plans.js?v=202609222256"></script>
<script src="js/i18n.js?v=202609222256"></script>
<script src="js/util.js?v=202609222256"></script>
<script src="js/plans.js?v=202609222256"></script>
<script src="js/app.js?v=202609222256"></script>
</body>
</html>
